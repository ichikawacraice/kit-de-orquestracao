# Publica @wicomm/tokens e @wicomm/guardas no GitHub Packages da org, privados.
# Roda a cada push na main que toca um dos dois pacotes (e à mão): publica só a
# versão do package.json que o registro ainda não tem. Versão nova = subir o
# "version" do pacote no PR; sem isso, o push passa sem publicar nada.
#
# O GitHub Packages exige que o escopo seja o dono: na org, o nome publicado é
# @wicomm-projects/<pacote>. O código (aqui e nos projetos) segue importando
# @wicomm/<pacote>; o projeto instala pelo alias do npm (docs/instalar-pacotes.md).
name: publicar-pacotes

on:
  push:
    branches: [main]
    paths:
      - packages/tokens/**
      - packages/guardas/**
      - .github/workflows/publicar-pacotes.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-pacotes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@wicomm-projects'

      - run: npm ci

      - name: Gate
        run: npm test

      - name: Publicar a versão que o registro não tem
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/tokens packages/guardas; do
            nome=$(node -p "require('./$dir/package.json').name.replace('@wicomm/', '@wicomm-projects/')")
            versao=$(node -p "require('./$dir/package.json').version")
            privado=$(node -p "require('./$dir/package.json').publishConfig?.access ?? ''")
            if [ "$privado" != "restricted" ]; then
              echo "::error::$nome sem publishConfig.access restricted: não publico"; exit 1
            fi
            # E404 = o pacote ainda não existe; versão que falta sai vazia com exit 0;
            # outro erro para o job. O stderr fica fora da comparação (avisos do npm).
            if saida=$(npm view "$nome@$versao" version 2>npm-view.err); then
              if [ "$saida" = "$versao" ]; then
                echo "$nome@$versao já publicado"; continue
              fi
            elif ! grep -q E404 npm-view.err; then
              cat npm-view.err; exit 1
            fi
            npm pkg set name="$nome" -w "$dir"
            npm publish -w "$dir"
            echo "::notice::publicado $nome@$versao"
          done
